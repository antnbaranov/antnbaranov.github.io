<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baranov — a letter is on its way</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 17px/1.5 -apple-system, system-ui, sans-serif; margin: 0; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  main { max-width: 420px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { margin: 8px 0; opacity: .75; }
  a.btn { display: inline-block; margin-top: 16px; padding: 14px 28px; border-radius: 14px;
          background: #007aff; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening Baranov…</h1>
  <p id="note">If nothing happens, tap the button. You need the Baranov app installed to follow this letter.</p>
  <a class="btn" id="open" href="baranov://expect">Open in Baranov</a>
</main>
<script>
(function () {
  var parts = location.pathname.split("/").filter(Boolean);
  if (parts[0] !== "l") {
    document.getElementById("title").textContent = "Baranov";
    document.getElementById("note").textContent = "Page not found.";
    document.getElementById("open").style.display = "none";
    return;
  }
  // /l/<ear tag>?id=…&from=…  ->  baranov://expect?id=…&from=…&code=<ear tag>
  var q = new URLSearchParams(location.search);
  var code = parts[1];
  if (code && code !== "expect") q.set("code", code);
  var url = "baranov://expect?" + q.toString();
  document.getElementById("open").href = url;
  if (q.get("from") && q.get("ram")) {
    document.getElementById("title").textContent = q.get("from") + " sent you a letter";
  }
  // Redirect only when the universal link did not already open the app.
  setTimeout(function () { location.href = url; }, 300);
})();
</script>
</body>
</html>
